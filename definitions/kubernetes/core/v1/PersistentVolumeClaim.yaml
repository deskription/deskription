apiVersion: deskription.io/v1alpha1
kind: Resource
metadata:
  name: kubernetes-core-v1-persistentvolumeclaim
spec:
  selector:
    apiGroup: core
    apiVersion: v1
    kind: PersistentVolumeClaim
  type: Storage
---
apiVersion: deskription.io/v1alpha1
kind: ResourceTable
metadata:

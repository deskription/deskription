apiVersion: deskription.io/v1alpha1
kind: Resource
metadata:
  name: openshift-apps-v1-deploymentconfig
spec:
  selector:
    apiGroup: apps.openshift.io
    apiVersion: v1
    kind: DeploymentConfig
  type: Workload
---
apiVersion: deskription.io/v1alpha1
kind: ResourceTable
metadata:
  name: openshift-apps-v1-deploymentconfig
spec:
  selector:
    apiGroup: apps.openshift.io
    apiVersion: v1
    kind: DeploymentConfig
  columns:
    - name: Name
      path: metadata.name
    - name: Status
      type: status
      path: status.phase
    - name: Ready
      width: short
      type: conditions
    - name: Restarts
      type: sum
      width: short
      path: status.containerStatuses.*.restartCount
    - name: Owner
      type: owners
      path: metadata.ownerReferences
    - name: Memory
      type: memory
      width: short
    - name: CPU
      type: cpu
      width: short
    - name: Created
      type: datetime
      path: metadata.creationTimestamp
---
apiVersion: deskription.io/v1alpha1
kind: ResourceDetails
metadata:
  name: openshift-apps-v1-deploymentconfig
spec:
  selector:
    apiGroup: apps.openshift.io
    apiVersion: v1
    kind: DeploymentConfig
  fields:
    - name: Name
    - name: Namespace
    - name: Labels
      path: metadata.labels
    - name: Annotations
      path: metadata.annotations
    - name: Created at
    - name: Owner
    - name: Status
